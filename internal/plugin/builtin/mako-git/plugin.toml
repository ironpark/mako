id = "mako-git"
version = "1.0.0"
publisher = "mako"
api = 1
entry = "main.js"
permissions = ["git:read", "git:write", "forge:read", "storage", "sessions:read", "sessions:write", "agents:ask"]

[[contributes.block]]
id = "panel"
title = "Git"
scope = "folder"
chrome = "toolbar"
hidden = true

[contributes.settings.autofix_default]
type = "boolean"
label = "Auto-fix pull requests by default"
description = "Turn on Auto-fix automatically for open pull requests you have not configured yet."
default = false
scope = "project"
