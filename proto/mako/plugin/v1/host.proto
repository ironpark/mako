// The Host API: what a plugin, run in the daemon's sandbox, may ask of
// mako. This schema is the only definition of it; `make proto` generates
// from it the daemon's dispatcher, which checks each call's permission
// before anything else, the JavaScript bindings a plugin calls with their
// types (mako.d.ts), and the WIT a wasm runtime will take (mako.wit). See
// docs/plugins.md.
//
// A service is a group of the API, which a plugin reaches as
// mako.<group>, the service's name without "Service" in lower camel case;
// each method takes and returns one message, as JSON over the JavaScript
// boundary. The generator takes only what WIT can say as well, and
// refuses the rest: see internal/plugin/apigen.
syntax = "proto3";

package mako.plugin.v1;

import "mako/plugin/v1/options.proto";

option go_package = "github.com/ironpark/mako/internal/plugin/hostapi";

// LogService writes to the daemon's log, under the plugin's name.
service LogService {
  // Write puts a line in the daemon's log.
  rpc Write(WriteRequest) returns (WriteResponse) {
    option (permission) = "none";
  }
}

// WriteRequest is a line for the log.
message WriteRequest {
  // level is "debug", "info", "warn" or "error"; "" is "info".
  string level = 1;
  // message is the line, cut at 4 KiB.
  string message = 2;
}

// WriteResponse says the line was written.
message WriteResponse {}

// SettingsService reads the plugin's own settings, which its manifest
// declares and the user sets in Settings ▸ Plugins.
service SettingsService {
  // GetSetting reads one setting.
  rpc GetSetting(GetSettingRequest) returns (GetSettingResponse) {
    option (permission) = "none";
  }
  // ListSettings reads every setting the manifest declares.
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse) {
    option (permission) = "none";
  }
}

// GetSettingRequest names a setting.
message GetSettingRequest {
  // key is the setting's key in the manifest.
  string key = 1;
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", or "session:<id>").
  string scope = 2;
}

// GetSettingResponse is a setting's value.
message GetSettingResponse {
  Setting setting = 1;
}

// ListSettingsRequest asks for every setting.
message ListSettingsRequest {
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", or "session:<id>").
  string scope = 1;
}

// ListSettingsResponse is every setting, in the manifest's order.
message ListSettingsResponse {
  repeated Setting settings = 1;
}

// Setting is a setting and its value: the user's, else the manifest's
// default, else empty.
message Setting {
  string key = 1;
  // type is the manifest's: "string", "secret", "boolean", "number" or
  // "select".
  string type = 2;
  // text is the value of a string, secret or select setting.
  string text = 3;
  // flag is the value of a boolean setting.
  bool flag = 4;
  // number is the value of a number setting.
  double number = 5;
  // set says the user set it, rather than leaving the default.
  bool set = 6;
}

// StorageService is the plugin's own store of keys and values, on this
// node, within a quota.
service StorageService {
  // GetItem reads the value of a key.
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option (permission) = "storage";
  }
  // SetItem writes the value of a key, unless it would take the store
  // over its quota.
  rpc SetItem(SetItemRequest) returns (SetItemResponse) {
    option (permission) = "storage";
  }
  // DeleteItem removes a key.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse) {
    option (permission) = "storage";
  }
  // ListKeys lists the keys that start with a prefix, in order.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (permission) = "storage";
  }
}

// GetItemRequest names a key.
message GetItemRequest {
  string key = 1;
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", or "session:<id>").
  string scope = 2;
}

// GetItemResponse is a key's value.
message GetItemResponse {
  // found says the key has a value.
  bool found = 1;
  string value = 2;
}

// SetItemRequest gives a key a value.
message SetItemRequest {
  // key is at most 256 bytes.
  string key = 1;
  // value is at most 256 KiB.
  string value = 2;
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", or "session:<id>").
  string scope = 3;
}

// SetItemResponse is the store after the write.
message SetItemResponse {
  // used is the bytes of every key and value the store holds.
  uint32 used = 1;
  // quota is the most it may hold.
  uint32 quota = 2;
}

// DeleteItemRequest names a key.
message DeleteItemRequest {
  string key = 1;
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", or "session:<id>").
  string scope = 2;
}

// DeleteItemResponse says whether there was a value.
message DeleteItemResponse {
  bool found = 1;
}

// ListKeysRequest gives the start of the keys to list.
message ListKeysRequest {
  string prefix = 1;
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", or "session:<id>").
  string scope = 2;
}

// ListKeysResponse is the keys.
message ListKeysResponse {
  repeated string keys = 1;
}

// SessionsService reads this node's sessions.
service SessionsService {
  // ListSessions lists the node's sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (permission) = "sessions:read";
  }
  // GetSession reads one session.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (permission) = "sessions:read";
  }
  // ReadTranscript reads a page of a session's conversation, as its agent
  // logged it: the latest messages, or those before a cursor an earlier
  // page gave. A session of this node's alone, at most 30 pages a minute.
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptResponse) {
    option (permission) = "sessions:read";
  }
  // Subscribe has the plugin told of the events of the kinds named, as
  // calls of its default export's on handlers (see SessionEvent): the
  // daemon starts the plugin for one when it is not running. What a
  // plugin subscribed to stays, kept on this node, until it unsubscribes,
  // or is removed.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse) {
    option (permission) = "sessions:read";
  }
  // Unsubscribe stops the events of the kinds named; none named stops
  // every one.
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse) {
    option (permission) = "sessions:read";
  }
}

// ReadTranscriptRequest names a session, and the page.
message ReadTranscriptRequest {
  string session_id = 1;
  // before is the cursor a page gave, to read the messages before it;
  // "" reads the latest.
  string before = 2;
  // limit is the most messages a page holds, at most 50; 0 is 20.
  uint32 limit = 3;
}

// ReadTranscriptResponse is a page of the conversation.
message ReadTranscriptResponse {
  // supported says mako reads the conversation its agent keeps.
  bool supported = 1;
  // messages are the page's, oldest first.
  repeated TranscriptMessage messages = 2;
  // before is the cursor of the page before this one; "" when this one
  // is the first.
  string before = 3;
  // truncated says text was cut: a message's, or the page's at 256 KiB.
  bool truncated = 4;
}

// TranscriptMessage is a message of a conversation.
message TranscriptMessage {
  // role is "user", "assistant" or "tool".
  string role = 1;
  // text is at most 8 KiB.
  string text = 2;
  // tool is the tool a call called; detail what it was given, at most 1
  // KiB, and result what it gave back, at most 2 KiB.
  string tool = 3;
  string detail = 4;
  string result = 5;
  // kind is what the tool does, whatever its agent calls it.
  string kind = 6;
  bool error = 7;
  // pending says a call was not answered yet.
  bool pending = 8;
}

// SubscribeRequest names kinds of event: "sessionStarted", "sessionEnded",
// "sessionSlept", "sessionStatus" and "agentMessage".
message SubscribeRequest {
  repeated string events = 1;
}

// SubscribeResponse is the kinds the plugin is subscribed to after.
message SubscribeResponse {
  repeated string events = 1;
}

// UnsubscribeRequest names kinds of event; none names every one.
message UnsubscribeRequest {
  repeated string events = 1;
}

// UnsubscribeResponse is the kinds the plugin is subscribed to after.
message UnsubscribeResponse {
  repeated string events = 1;
}

// SessionEvent is what a plugin subscribed to a kind of event is told,
// as a call of the handler of its kind in its default export's on, as a
// block's on is called for a message: on.sessionStarted(event), ...
// Events are of this node's sessions alone, at most 10 a second to a
// plugin, the rest dropped; none comes while the plugin lacks
// sessions:read, is disabled, refused or blocked.
message SessionEvent {
  // kind is "sessionStarted", "sessionEnded", "sessionSlept" (its
  // program stopped, to start again on its conversation),
  // "sessionStatus" (its agent's status changed), "agentMessage",
  // "agentStarted", "agentRefused", "layoutChanged", "layoutRefused",
  // "decisionAnswered", "decisionFailed", "agentAskStarted",
  // "agentAnswered", or "agentAskFailed".
  string kind = 1;
  // session is the session, as it stands after.
  Session session = 2;
  // previous_status is its agent's status before, for sessionStatus.
  string previous_status = 3;
  // message is the message, for agentMessage.
  AgentMessage message = 4;
  // request_id is a StartAgent's, for "agentStarted", when the agent it
  // asked for started (session is it), and "agentRefused", when the user
  // refused it or it did not start (error says why). These two come to
  // a plugin that asked, without a subscription.
  string request_id = 5;
  string error = 6;
  // document and revision are, for "layoutChanged", the window layout
  // document a PatchLayout changed and its revision after; a
  // "layoutRefused" tells why it did not change in error. These two come
  // to a plugin that asked, without a subscription.
  string document = 7;
  string revision = 8;
  // output is, for "agentAnswered", the agent's answer (JSON text when the
  // ask's format was json), at most 64 KiB; truncated says it was cut.
  string output = 9;
  bool truncated = 10;
  // response_json is, for "decisionAnswered", the normalized response.
  string response_json = 11;
  // elapsed_ms is how long an ask or a decision took.
  uint32 elapsed_ms = 12;
  // tag is the tag the ask or Submit gave.
  string tag = 13;
  // code says why, for "agentAskFailed" and "decisionFailed": "refused",
  // "canceled", "timeout", "unavailable" or "failed". These kinds
  // come to a plugin that asked, without a subscription.
  string code = 14;
  // agent and profile name the agent running an ask, for "agentAskStarted"
  // (emitted when a previously pending ask is approved and starts running).
  string agent = 15;
  string profile = 16;
}

// AgentMessage is a message one agent sent another of this node's, as
// send_message does, or the window or mako left it.
message AgentMessage {
  string id = 1;
  string from_session_id = 2;
  string to_session_id = 3;
  // text is at most 4 KiB.
  string text = 4;
  // note says mako wrote it, of the agent from: not one it sent.
  bool note = 5;
}

// ListSessionsRequest asks for the sessions.
message ListSessionsRequest {}

// ListSessionsResponse is the sessions, oldest first.
message ListSessionsResponse {
  repeated Session sessions = 1;
}

// GetSessionRequest names a session.
message GetSessionRequest {
  string id = 1;
}

// GetSessionResponse is the session.
message GetSessionResponse {
  // found says there is a session of the ID.
  bool found = 1;
  Session session = 2;
}

// Session is a session as a plugin sees it: no terminal; its transcript
// is ReadTranscript's.
message Session {
  string id = 1;
  string name = 2;
  // agent is what runs in it: "claude", "codex", "shell", ...
  string agent = 3;
  // project is its working folder.
  string project = 4;
  // state is its process's: "starting", "running", "exited", or
  // "stopped", asleep, to start again on its conversation.
  string state = 5;
  // status is its agent's: "idle", "working", "waiting" or "done".
  string status = 6;
  string node_id = 7;
}

// HttpService makes HTTP requests for the plugin, to the hosts its
// manifest names as net:<host> and the user allowed: by https, on the
// default port, following redirects only within the host. Each request
// is logged under the plugin's name.
service HttpService {
  // Fetch makes a request and reads the response.
  rpc Fetch(FetchRequest) returns (FetchResponse) {
    option (permission) = "net";
  }
}

// FetchRequest is a request.
message FetchRequest {
  // url is an https URL of a host the plugin may reach.
  string url = 1;
  // method is GET, HEAD, POST, PUT, PATCH or DELETE; "" is GET.
  string method = 2;
  map<string, string> headers = 3;
  // body is at most 256 KiB.
  string body = 4;
}

// FetchResponse is the response.
message FetchResponse {
  uint32 status = 1;
  map<string, string> headers = 2;
  // body is at most 1 MiB; a larger one fails the call.
  string body = 3;
}

// CommandsService runs the window's commands a plugin may use.
service CommandsService {
  // RunCommand runs a command of the window's: "mako.openUrl", with the
  // URL as its argument, opens an http or https link in the browser, and
  // only in answer to the user's tap or command.
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse) {
    option (permission) = "none";
  }
}

// RunCommandRequest names a command and its argument.
message RunCommandRequest {
  string id = 1;
  string arg = 2;
}

// RunCommandResponse says the command was run.
message RunCommandResponse {}

// DbService gives a plugin sandboxed SQLite databases (per scope) and optional
// CRDT-replicated synced tables shared across paired Mako nodes over the
// daemon's libp2p mesh.
service DbService {
  // Query runs a single read-only SQL statement (SELECT / WITH / EXPLAIN).
  rpc Query(QueryRequest) returns (QueryResponse) {
    option (permission) = "db";
  }
  // Exec runs a single DML or DDL SQL statement.
  rpc Exec(ExecRequest) returns (ExecResponse) {
    option (permission) = "db";
  }
  // Batch runs up to 64 DML/DDL statements atomically in one transaction.
  rpc Batch(BatchRequest) returns (BatchResponse) {
    option (permission) = "db";
  }
  // Stats returns the plugin's total SQLite database usage, quota, and
  // registered synced tables in the requested scope.
  rpc Stats(StatsRequest) returns (StatsResponse) {
    option (permission) = "db";
  }
  // SyncEnable registers a row-level CRDT synced table backed by SQLite
  // columns (id, doc, updated_at, deleted) replicated across paired peers.
  rpc SyncEnable(SyncEnableRequest) returns (SyncEnableResponse) {
    option (permission) = "db:sync";
  }
  // SyncPut stamps a JSON row with the node's HLC clock, writes it to the
  // synced SQLite table, and schedules P2P replication to trusted peers.
  rpc SyncPut(SyncPutRequest) returns (SyncPutResponse) {
    option (permission) = "db:sync";
  }
  // SyncDelete marks a synced row as deleted (tombstone) with the node's HLC
  // clock and schedules P2P replication to trusted peers.
  rpc SyncDelete(SyncDeleteRequest) returns (SyncDeleteResponse) {
    option (permission) = "db:sync";
  }
}

// QueryRequest is a read-only SQL query against the plugin's database.
message QueryRequest {
  string sql = 1;
  // params_json are positional SQL parameters encoded as JSON scalars
  // (string, number, boolean, or null).
  repeated string params_json = 2;
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", or "session:<id>").
  string scope = 3;
}

// QueryResponse holds query columns and JSON-encoded rows.
message QueryResponse {
  repeated string columns = 1;
  // rows_json holds each row as a JSON array of column values matching columns.
  repeated string rows_json = 2;
  // truncated says more rows existed past the per-query row or byte cap.
  bool truncated = 3;
}

// ExecRequest is a single DML or DDL SQL statement.
message ExecRequest {
  string sql = 1;
  repeated string params_json = 2;
  string scope = 3;
}

// ExecResponse reports the result of a DML/DDL statement.
message ExecResponse {
  int32 rows_affected = 1;
  double last_insert_id = 2;
}

// DbStatement is one SQL statement inside a BatchRequest transaction.
message DbStatement {
  string sql = 1;
  repeated string params_json = 2;
}

// BatchRequest runs multiple statements atomically in one transaction.
message BatchRequest {
  repeated DbStatement statements = 1;
  string scope = 2;
}

// BatchResponse holds the result of each statement in the batch.
message BatchResponse {
  repeated ExecResponse results = 1;
}

// StatsRequest asks for database usage and synced tables.
message StatsRequest {
  string scope = 1;
}

// StatsResponse reports total plugin DB bytes, quota, and synced tables.
message StatsResponse {
  uint32 used_bytes = 1;
  uint32 quota_bytes = 2;
  repeated string sync_tables = 3;
}

// SyncEnableRequest registers a synced table name in the database.
message SyncEnableRequest {
  string table = 1;
  string scope = 2;
}

// SyncEnableResponse confirms the synced table name.
message SyncEnableResponse {
  string table = 1;
}

// SyncPutRequest upserts one CRDT-replicated JSON row.
message SyncPutRequest {
  string table = 1;
  string id = 2;
  string doc_json = 3;
  string scope = 4;
}

// SyncPutResponse reports the stamped wall time in Unix ms.
message SyncPutResponse {
  double updated_at = 1;
}

// SyncDeleteRequest tombstones one CRDT-replicated row.
message SyncDeleteRequest {
  string table = 1;
  string id = 2;
  string scope = 3;
}

// SyncDeleteResponse says whether the row existed before deletion.
message SyncDeleteResponse {
  bool deleted = 1;
}

// DatafsService gives a plugin its own sandboxed, per-scope directory tree
// under plugin-data/<id>/files/ for storing and managing files and folders
// within a quota.
service DatafsService {
  // ReadData reads a regular file from the plugin's private data directory.
  rpc ReadData(ReadDataRequest) returns (ReadDataResponse) {
    option (permission) = "fs:data";
  }
  // WriteData writes a regular file whole, atomically, inside the plugin's
  // private data directory.
  rpc WriteData(WriteDataRequest) returns (WriteDataResponse) {
    option (permission) = "fs:data";
  }
  // ListData lists entries in a directory (optionally recursively) inside the
  // plugin's private data directory.
  rpc ListData(ListDataRequest) returns (ListDataResponse) {
    option (permission) = "fs:data";
  }
  // StatData returns metadata for a file or directory inside the plugin's
  // private data directory.
  rpc StatData(StatDataRequest) returns (StatDataResponse) {
    option (permission) = "fs:data";
  }
  // MkdirData creates a directory (and any missing parents) inside the
  // plugin's private data directory.
  rpc MkdirData(MkdirDataRequest) returns (MkdirDataResponse) {
    option (permission) = "fs:data";
  }
  // DeleteData removes a file or directory inside the plugin's private data
  // directory.
  rpc DeleteData(DeleteDataRequest) returns (DeleteDataResponse) {
    option (permission) = "fs:data";
  }
  // MoveData renames or moves a file or directory within the same scope of the
  // plugin's private data directory.
  rpc MoveData(MoveDataRequest) returns (MoveDataResponse) {
    option (permission) = "fs:data";
  }
  // DataStats returns total bytes used across the plugin's private data
  // directory, its quota, and file count.
  rpc DataStats(DataStatsRequest) returns (DataStatsResponse) {
    option (permission) = "fs:data";
  }
}

// ReadDataRequest names a file and optional byte slice inside the plugin's data dir.
message ReadDataRequest {
  string path = 1;
  double offset = 2;
  uint32 length = 3;
  string scope = 4;
}

// ReadDataResponse returns the file's contents when found.
message ReadDataResponse {
  bool found = 1;
  string text = 2;
  bytes data = 3;
  double size = 4;
  bool eof = 5;
  bool binary = 6;
  double modified_ms = 7;
}

// WriteDataRequest writes text or bytes to a file in the plugin's data dir.
message WriteDataRequest {
  string path = 1;
  string text = 2;
  bytes data = 3;
  bool make_dirs = 4;
  string scope = 5;
}

// WriteDataResponse reports the written size and plugin-wide quota usage.
message WriteDataResponse {
  double size = 1;
  uint32 used_bytes = 2;
  uint32 quota_bytes = 3;
}

// ListDataRequest lists a directory in the plugin's data dir.
message ListDataRequest {
  string path = 1;
  bool recursive = 2;
  string scope = 3;
}

// DataEntry describes one file or directory inside the plugin's data dir.
message DataEntry {
  // path is the slash-separated path relative to the scope root.
  string path = 1;
  // name is the entry's base name.
  string name = 2;
  bool dir = 3;
  double size = 4;
  double modified_ms = 5;
}

// ListDataResponse holds directory entries sorted by path.
message ListDataResponse {
  repeated DataEntry entries = 1;
  bool truncated = 2;
}

// StatDataRequest asks for metadata of a path in the plugin's data dir.
message StatDataRequest {
  string path = 1;
  string scope = 2;
}

// StatDataResponse reports whether a path exists and its metadata.
message StatDataResponse {
  bool found = 1;
  bool dir = 2;
  double size = 3;
  double modified_ms = 4;
}

// MkdirDataRequest creates a directory path in the plugin's data dir.
message MkdirDataRequest {
  string path = 1;
  string scope = 2;
}

// MkdirDataResponse confirms directory creation.
message MkdirDataResponse {}

// DeleteDataRequest removes a file or directory in the plugin's data dir.
message DeleteDataRequest {
  string path = 1;
  bool recursive = 2;
  string scope = 3;
}

// DeleteDataResponse says whether the target existed before deletion.
message DeleteDataResponse {
  bool deleted = 1;
}

// MoveDataRequest moves or renames a file or directory within a scope.
message MoveDataRequest {
  string from_path = 1;
  string to_path = 2;
  bool make_dirs = 3;
  string scope = 4;
}

// MoveDataResponse confirms the move.
message MoveDataResponse {}

// DataStatsRequest asks for plugin private file quota and usage.
message DataStatsRequest {
  string scope = 1;
}

// DataStatsResponse reports plugin-wide file storage usage and quota.
message DataStatsResponse {
  uint32 used_bytes = 1;
  uint32 quota_bytes = 2;
  uint32 file_count = 3;
}
