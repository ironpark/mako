syntax = "proto3";

package mako.v2;

option go_package = "github.com/ironpark/mako/internal/protocol";

// ReadChat reads the conversation of a session's agent.
message ReadChat {
  string node_id = 1;
  string session_id = 2;
  bool usage_only = 3; // the usage alone, without the messages
  // before and after page through the log: the messages of the records
  // after one byte offset and before another, both a Chat's start, as a
  // reader scrolling back asks. 0 leaves an end open; with both 0, the
  // latest messages. A read keeps the latest of what it finds, as many as
  // the latest messages alone.
  int64 before = 4;
  int64 after = 5;
  // seen is the digest of the Chat the reader has: when the reply would
  // be the same, it comes back unchanged, without the messages.
  uint64 seen = 6;
}

// ChatMessage is one turn of a conversation.
message ChatMessage {
  string role = 1; // user, assistant or tool
  string text = 2;
  string id = 3;
  string tool = 4;
  string detail = 5;
  string result = 6;
  bool output = 7;
  bool error = 8;
  bool pending = 9; // a call not answered yet
  // kind is what the tool does, whatever its agent calls it: one of
  // protocol's Tool kinds, "" for a tool the agent's driver does not know.
  string kind = 10;
  optional int32 exit_code = 11; // a command's, when its agent says
}

// Chat answers ReadChat.
message Chat {
  bool supported = 1;
  string conversation = 2;
  repeated ChatMessage messages = 3;
  bool truncated = 4;
  Usage usage = 5;
  repeated SubAgent agents = 6; // the subagents its calls started, oldest first
  // start is the byte offset in the log the messages start at: 0 when
  // nothing comes before them, else the before of a read that finds more.
  int64 start = 7;
  // digest names this reply, for the next read's seen.
  uint64 digest = 8;
  // unchanged says the reply is the one seen named; only digest is set.
  bool unchanged = 9;
}

// SubAgent is an agent a call of the conversation's started, such as
// Claude's Agent tool does, and how far it has got.
message SubAgent {
  string id = 1;
  string call_id = 2; // the call that started it, if it is known
  string kind = 3; // the sort of agent, as Explore
  string description = 4;
  bool running = 5;
  int32 tool_calls = 6; // how many calls it has made
  string tool = 7; // its latest call
  string detail = 8;
  int64 started = 9; // Unix seconds
  int64 updated = 10; // Unix seconds, when it last wrote
  string tool_kind = 11; // what its latest call does, as ChatMessage.kind
}

// Usage is the tokens a conversation has spent.
message Usage {
  int64 input = 1;
  int64 cached_input = 2;
  int64 output = 3;
  int64 context = 4;
  int64 window = 5;
  repeated RateLimit limits = 6; // the shortest window first
}

// RateLimit is how much of one of an account's limits is spent.
message RateLimit {
  int64 minutes = 1; // the window it spans
  double used = 2; // percent
  int64 resets = 3; // Unix seconds
}
