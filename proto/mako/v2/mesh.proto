syntax = "proto3";

package mako.v2;

import "google/protobuf/timestamp.proto";
import "mako/v2/session.proto";

option go_package = "github.com/ironpark/mako/internal/protocol";

// Hello opens every stream and says who is calling, for the log: whether
// the caller is a front-end or a peer is where the stream comes from.
message Hello {
  string name = 2;
  string version = 3;
  // node_id and is_peer said who called; auth_tag and token carried the
  // mesh's key, then a front-end's token, before the socket.
  reserved 1, 4, 5;
  // hops is how many daemons a request on a peer's stream went through
  // before the one that sent it: 0 from the daemon whose front-end made
  // it. A daemon passes on no request past a limit, so a stale route
  // cannot send one round in a loop.
  uint32 hops = 6;
  reserved "node_id", "is_peer", "auth_tag", "token";
}

// Welcome answers a Hello: the daemon describing itself.
message Welcome {
  Node node = 1;
}

// Node is a daemon on the mesh.
message Node {
  string id = 1;
  string name = 2;
  string addr = 3;
  string os = 4;
  string arch = 5;
  string version = 6;
  string source = 7; // mdns, tailscale, mesh, self
  google.protobuf.Timestamp last_seen = 8;
  repeated string features = 9; // protocol extensions it speaks
  repeated AgentInfo agents = 10; // what it can launch
  int64 revision = 11; // protocol.Revision of its build
  // peer_id is its libp2p identity, and multiaddrs where it listens for
  // libp2p, relayed addresses included; empty from a daemon without it.
  string peer_id = 12;
  repeated string multiaddrs = 13;
  // How the daemon answering stands with this node, which only that
  // daemon can say: whether it lets the node in (trusted), and whether the
  // node lets it in (trusts_us), so that requests reach the node through
  // it. Both are false for a node it has no link to.
  bool trusted = 14;
  bool trusts_us = 15;
  // key is the fingerprint of the node's own key, and owner that of the
  // SSH key that vouches for it, if one does.
  string key = 16;
  string owner = 17;
  // How the daemon answering reaches the node, when it can: hops is how
  // many daemons a request goes through to it, 1 when the node lets the
  // daemon in and more through nodes that do, each letting in the one
  // before; via is the node ID of the peer the request goes to first,
  // when hops is more than 1. 0 and empty for a node it cannot reach.
  uint32 hops = 18;
  string via = 19;
}

// AgentInfo names an agent a node can launch and its profiles, and what
// the node's driver for it says of it, so a front-end that has no driver
// for the agent still shows it: none of those for an agent the node knows
// only by its command.
message AgentInfo {
  string name = 1;
  repeated string profiles = 2;
  string icon = 3; // the glyph's name
  uint32 color = 4; // 0xRRGGBBAA, 0 for none
  uint32 caps = 5; // protocol's Cap bits
}

// ListNodes asks for the daemon and its peers.
message ListNodes {}

// Nodes answers ListNodes.
message Nodes {
  repeated Node nodes = 1;
}

// NodeState is what a daemon sends of itself to the peers it is linked
// with: its record, and whether a front-end of its is offering to answer
// approvals; and to the peers it lets in, its own sessions and the other
// nodes it knows of too.
message NodeState {
  Node node = 1;
  repeated SessionInfo sessions = 2;
  bool watching_approvals = 3;
  repeated Node peers = 4;
  // workspace is the latest of the windows' workspaces the daemon holds,
  // for the peers it lets in and that let it in to take up.
  Workspace workspace = 5;
}

// Workspace is what a window shows: its tabs and panes, in each of its
// spaces, as the front-end writes them down. The daemon keeps the latest
// a front-end gave it or a peer it trusts both ways sent, and shares it
// with those peers, so the windows of one person's nodes show the same.
message Workspace {
  bytes doc = 1; // the front-end's, opaque to the daemon
  int64 version = 2; // when it was made, in Unix nanoseconds: the later wins
  string node_id = 3; // where it was made, which breaks a tie
}

// GetWorkspace asks the daemon for the workspace it holds; it answers with
// a Workspace, empty when it holds none. A front-end sends a Workspace to
// give the daemon its own, and hears back the one the daemon holds after.
message GetWorkspace {}

// Watch turns a front-end's stream into a feed of changes: the daemon
// answers with a Changed whenever the mesh's nodes or sessions change.
message Watch {
  // approvals watches for approvals too, for as long as the stream stays
  // open, as a listing with approvals does for a while.
  bool approvals = 1;
}

// Changed says what changed, for the front-end to ask for again.
message Changed {
  bool nodes = 1;
  bool sessions = 2;
  bool access = 3; // an access request came, or the keys changed
  bool workspace = 4; // a newer workspace came from a peer, or a window
}

// Access asks the daemon about who it lets in, or changes it. Only a
// front-end of the daemon's own may send it.
message Access {
  // op is what to do: "" lists; "request" asks node_id to let this node
  // in, with note; "allow" lets in the node node_id that asked, by its own
  // key or with owner by the SSH key that vouches for it; "deny" drops its
  // request; "add" lets in the authorized_keys line key; "revoke" removes
  // the key whose fingerprint is key.
  string op = 1;
  string node_id = 2;
  string key = 3;
  bool owner = 4;
  string note = 5;
}

// AccessInfo answers Access: this node's keys, the requests waiting, and
// the keys it lets in.
message AccessInfo {
  AccessKey key = 1; // this node's own
  AccessKey owner = 2; // the SSH key vouching for it, if one does
  repeated AccessRequest requests = 3;
  repeated AccessKey keys = 4;
}

// AccessKey is a public key.
message AccessKey {
  string fingerprint = 1; // SHA256:…
  string type = 2; // ssh-ed25519, …
  string comment = 3;
  string line = 4; // as authorized_keys has it
  // source is the file outside mako's own that lets the key in, which
  // mako reads and does not edit: the user's ~/.ssh/authorized_keys.
  // Empty for a key of mako's own file.
  string source = 5;
}

// AccessRequest is a node asking to be let in.
message AccessRequest {
  Node node = 1;
  AccessKey key = 2; // its own
  AccessKey owner = 3; // the SSH key vouching for it, if one does
  string note = 4;
  google.protobuf.Timestamp at = 5;
}
