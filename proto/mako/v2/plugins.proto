syntax = "proto3";

package mako.v2;

import "mako/v2/workspace.proto";

option go_package = "github.com/ironpark/mako/internal/protocol";

// Plugins run in the daemon (docs/plugins.md). A front-end lists them,
// answers what they ask for, runs their commands and sets their settings
// with these messages, and draws their blocks from the trees the daemon
// sends: the tree first, then patches to it. Plugins are a node's own: a
// peer is refused (revision 26).

// ListPlugins asks for the node's plugins; answered by Plugins.
message ListPlugins {}

// Plugins are the node's plugins, in the order of their IDs.
message Plugins {
  repeated PluginInfo plugins = 1;
  // secrets is where the node keeps its plugins' secrets: the name of the
  // system's keychain ("macOS Keychain", "Secret Service", "Windows
  // Credential Manager"), or "file" when it reaches none, a file of each
  // plugin's only the user may read, secrets_note saying why (revision
  // 32). "" from an older daemon.
  string secrets = 2;
  string secrets_note = 3;
}

// PluginInfo is a plugin as its manifest declares it, and how it stands.
message PluginInfo {
  string id = 1;
  string version = 2;
  string publisher = 3;
  // state is protocol's PluginState: "waiting" for the user to allow what
  // it asks for, "denied", "ready" (allowed, not running), "running",
  // "failed" (stopped: error says why) or "disabled" by the user.
  string state = 4;
  // error is why it is not running, or, stale, why its newer version
  // could not replace the one running.
  string error = 5;
  // stale says the version running is the last that worked, the folder's
  // newer one having failed.
  bool stale = 6;
  // permissions are what its manifest asks for; granted those the user
  // allowed; asked those asked for and not allowed, which the user is to
  // answer before it runs.
  repeated string permissions = 7;
  repeated string granted = 8;
  repeated string asked = 9;
  repeated PluginBlock blocks = 10;
  repeated PluginCommand commands = 11;
  repeated PluginSetting settings = 12;
  // installed says the plugin was installed from a registry's package,
  // not written into its folder by hand (revision 29); source is that
  // registry's URL, key the publisher key pinned at its first install
  // (pluginstore.proto's PublisherKey form), update a newer version its
  // registry lists, signed by that key.
  bool installed = 13;
  string source = 14;
  string key = 15;
  string update = 16;
  // blocked is why a registry of this node's blocks the plugin: state is
  // then "blocked", and it cannot be enabled while it stands.
  string blocked = 17;
  // agent_ask is an agent the plugin asks to start, which waits for the
  // user to allow it, once or always for this plugin (revision 32): a
  // PluginAction "allow_agent" or "deny_agent" with key its id answers.
  PluginAgentAsk agent_ask = 18;
  // agents_allowed says the user let the plugin start agents without
  // asking; "forget_agents" has it ask again.
  bool agents_allowed = 19;
  // tools are the MCP tools the plugin contributes to agents (revision 41).
  repeated PluginTool tools = 20;
  // logs are the most recent log lines the plugin wrote (revision 41).
  repeated PluginLog logs = 21;
  // storage_used and storage_quota are the bytes the plugin's KV store holds
  // and its limit on this node (revision 41).
  int64 storage_used = 22;
  int64 storage_quota = 23;
  // db_used and db_quota are the bytes the plugin's SQLite databases hold
  // and its limit on this node (revision 43).
  int64 db_used = 24;
  int64 db_quota = 25;
}

// PluginTool is an MCP tool a plugin contributes to running agents.
message PluginTool {
  string id = 1;
  string description = 2;
  // scope is the tool's declared scope: "", "global", "space", "project" or
  // "session" (revision 42).
  string scope = 3;
}

// PluginLog is one recent log line written by a plugin via log.write.
message PluginLog {
  int64 at = 1; // Unix ms
  string level = 2;
  string message = 3;
}

// PluginAgentAsk is an agent a plugin asks to start (sessions:write) or ask
// a one-shot question (agents:ask, kind "ask"): which agent and profile, in
// which folder of which project, named/titled what, and the first 2 KiB of
// the prompt.
message PluginAgentAsk {
  string id = 1;
  string agent = 2;
  string profile = 3;
  string project = 4; // the project's name
  string root = 5;    // the folder it would run in
  string name = 6;
  string prompt = 7;
  int64 since = 8; // Unix ms
  // kind is "" for an agent to start (sessions:write), "ask" for a question
  // asked of an agent once (agents:ask; revision 45).
  string kind = 9;
}

// PluginBlock is a block a plugin contributes.
message PluginBlock {
  // name is the block's registered name, plugin:<id>/<block>.
  string name = 1;
  string title = 2;
  // slots are where the manifest suggests placing it: "left", "right",
  // "top", "bottom".
  repeated string slots = 3;
  // scope is the block's declared scope: "", "global", "space", "project" or
  // "session" (revision 42).
  string scope = 4;
}

// PluginCommand is a command a plugin contributes to the palette.
message PluginCommand {
  string id = 1;
  string title = 2;
}

// PluginSetting is a setting a plugin declares, and its value.
message PluginSetting {
  string key = 1;
  // type is "string", "secret", "boolean", "number" or "select".
  string type = 2;
  string label = 3;
  string description = 4;
  repeated string options = 5; // a select's
  // value is the setting as text: "true" or "false" for a boolean, a
  // number in decimal; never a secret's, which set alone tells of.
  string value = 6;
  bool set = 7;
  // scope is the setting's declared scope: "", "global", "space", "project" or
  // "session" (revision 42).
  string scope = 8;
  // scoped_values holds non-secret per-scope overrides keyed by canonical scope
  // key (e.g. "project:<id>", revision 42). Never populated for secrets.
  map<string, string> scoped_values = 9;
  // scoped_set lists canonical scope keys where a secret override is set
  // (revision 42); secret values are never sent to front-ends.
  repeated string scoped_set = 10;
}

// PluginAction acts on a plugin, for the user: op "grant" allows what it
// asks for, "deny" refuses it, "enable" and "disable" start and stop it
// being used, "reload" reads its folder again, "run" runs its command
// command, and "set" sets its setting key to value ("" unsets it). From
// revision 32, "allow_agent" lets the agent start that the ask of id key
// asks for, value "once" or "always" (for this plugin from then on),
// "deny_agent" refuses it, and "forget_agents" has the plugin ask again
// before every agent it starts. Answered by PluginDone.
message PluginAction {
  string plugin_id = 1;
  string op = 2;
  string command = 3;
  string key = 4;
  string value = 5;
  // scope is the optional canonical scope key ("" for global, "space:<id>",
  // "project:<id>", "session:<id>") for scoped settings or commands (revision 42).
  string scope = 6;
  // locale is the front-end's optional BCP-47 language tag (e.g. "en", "ko",
  // "ko-KR"; empty defaults to "en", revision 44).
  string locale = 7;
}

// PluginDone answers PluginAction and BlockEvent.
message PluginDone {
  // open_url is a link the plugin asked, in answer to this, to open in
  // the browser: the front-end that sent the request opens it.
  string open_url = 1;
  // toast is a short status notice the plugin asked the front-end to show
  // via mako.toast (revision 41).
  string toast = 2;
}

// WatchBlock follows a plugin's block, plugin:<id>/<block>: the daemon
// answers with a BlockUpdate holding the tree, then one whenever it
// changes, until the stream closes. A block is running while a front-end
// watches it.
message WatchBlock {
  string block = 1;
  // node_id is the node whose block it is, routed as a request's: a node
  // let in watches the blocks of the node that lets it in (revision 30).
  string node_id = 2;
  // scope is the canonical scope key ("" for global, "space:<id>",
  // "project:<id>", "session:<id>", revision 42).
  string scope = 3;
  // locale is the front-end's optional BCP-47 language tag (e.g. "en", "ko",
  // "ko-KR"; empty defaults to "en", revision 44).
  string locale = 4;
}

// BlockUpdate is a block's tree, whole or as the changes since the last.
message BlockUpdate {
  string block = 1;
  // seq counts the updates on the stream from 1.
  uint64 seq = 2;
  // tree is the whole tree, in the first update and whenever the
  // front-end is to start again; nil with ops, or with no tree yet.
  UiNode tree = 3;
  // ops change the tree the last update left, in order.
  repeated UiOp ops = 4;
  // plugin is the ID of the plugin that draws the block, and title the
  // block's, which the front-end frames it with.
  string plugin = 5;
  string title = 6;
  // state is the plugin's, as PluginInfo.state; error and stale as
  // there, or an error of the block's own last call.
  string state = 7;
  string error = 8;
  bool stale = 9;
  // session_id and agent are, for an agent's block, agent:<session>/<id>,
  // the session that shows it and its agent's name, which the front-end
  // frames it with in place of a plugin's (revision 27).
  string session_id = 10;
  string agent = 11;
  // gone says the block was closed, or its plugin removed: the last
  // update of the stream.
  bool gone = 12;
  // scope is the canonical scope key of this block instance (revision 42).
  string scope = 13;
}

// BlockEvent is the user acting on a node of a block's tree: kind "tap",
// "change" or "submit" with the input's, toggle's or select's value, or
// "drop" with the dragged node's drag payload as value (revision 40).
// Answered by PluginDone.
message BlockEvent {
  string block = 1;
  string node = 2; // the node's id
  string kind = 3;
  string value = 4;
  // values are the block's inputs', toggles' and selects' values as the
  // front-end has them, by node id, typed or not yet sent: a form's
  // submit carries every field (revision 27).
  map<string, string> values = 5;
  // node_id is the node whose block it is, as WatchBlock's (revision 30).
  string node_id = 6;
  // scope is the canonical scope key of the target block instance (revision 42).
  string scope = 7;
  // locale is the front-end's optional BCP-47 language tag (e.g. "en", "ko",
  // "ko-KR"; empty defaults to "en", revision 44).
  string locale = 8;
}

// UiNode is a node of a plugin block's tree. The kinds are a fixed set
// (docs/plugins.md): column, row, stack, card, scroll, wrap, grid, split,
// collapsible, breadcrumb, tree, tree_item, text, icon, pill, chip, button,
// list, input, textarea, toggle, select, tabs, table, markdown, code,
// progress, divider, chart (revision 33), and graph (revision 44); a colour
// is a token, never a value.
message UiNode {
  // id is the node's path from the root by its own and its ancestors'
  // keys, which patches find it by: unique in the tree.
  string id = 1;
  string kind = 2;
  // text is what a text, pill, chip, button, markdown, code, collapsible or
  // tree_item node shows; an input's or textarea's placeholder; a toggle's
  // label; a chart's or graph's caption.
  string text = 3;
  // tone is the colour token: "", "muted", "faint", "accent", "success",
  // "warning", "danger".
  string tone = 4;
  // icon is a bundled icon's name, for an icon, button, collapsible or
  // tree_item node.
  string icon = 5;
  // weight is "", "medium" or "semibold"; size "", "small" or "large".
  string weight = 6;
  string size = 7;
  // value is an input's/textarea's text, a select's/tabs' choice, a
  // tree_item's secondary/meta text, or a graph's focused node ID; checked
  // is a toggle's state or a collapsible's/tree_item's expanded/selected state.
  string value = 8;
  bool checked = 9;
  repeated string options = 10; // a select's, tabs', or breadcrumb's
  // progress is a progress bar's, from 0 to 1.
  double progress = 11;
  string language = 12; // a code node's
  bool disabled = 13;
  // grow shares out a row's or column's room left among the children
  // that set it; gap is the room between a container's children.
  double grow = 14;
  double gap = 15;
  // tap says tapping the node is answered; change that its value changing
  // (or a markdown link, breadcrumb segment, graph node click, or
  // collapsible/tree_item expansion toggle) is answered.
  bool tap = 16;
  bool change = 17;
  repeated UiNode children = 18;
  // chart is a chart node's kind of chart: "line", "bar", "sparkline"
  // (revision 33), "donut" or "pie" (revision 44). Its series are numbers,
  // each series's colour a token; labels name the points along its axis (or
  // slices of a donut/pie); text is its caption. A front-end that does not
  // know the kind draws nothing in its place.
  string chart = 19;
  repeated UiSeries series = 20;
  repeated string labels = 21;
  // drag is the payload carried when this node is dragged, non-empty when
  // draggable; drop says dropping a dragged node of the same block on this
  // node is answered by a BlockEvent of kind "drop" with that payload as
  // value (revision 40).
  string drag = 22;
  bool drop = 23;
  // drag_group tags a draggable node; drop_accept restricts a drop target to
  // drags matching one of those groups (empty accepts any group, revision 41).
  string drag_group = 24;
  repeated string drop_accept = 25;
  // direction ("vertical" or "horizontal") configures a scroll (revision 41)
  // or split (revision 44) container; max_height (px) configures a scroll
  // container (0..4000) or graph canvas (120..1200).
  string direction = 26;
  double max_height = 27;
  // variant styles a node by kind: button ("primary", "secondary", "outline",
  // "ghost", "danger"), card (same plus "soft"), pill/chip ("soft", "solid",
  // "outline"), progress ("spinner"), scroll ("follow"), tree_item ("badge")
  // (revision 44; extended in revision 45).
  string variant = 28;
  // columns is the column count (1..6) of a grid container (revision 44).
  int32 columns = 29;
  // ratio is the initial primary pane fraction (0.1..0.9) of a split
  // container (revision 44).
  double ratio = 30;
  // fill on a root container (column, row, or split) tells front-ends to skip
  // outer auto-scroll so plugins can pin toolbars and scroll inner panes
  // (revision 44).
  bool fill = 31;
  // graph_nodes and graph_edges define a declarative interactive graph canvas
  // for a graph node (revision 44).
  repeated UiGraphNode graph_nodes = 32;
  repeated UiGraphEdge graph_edges = 33;
}

// UiSeries is a series of a chart node: its name, colour token and values,
// finite numbers, as many as its chart's labels when it has them.
message UiSeries {
  string name = 1;
  string tone = 2;
  repeated double values = 3;
}

// UiGraphNode is a node in a declarative interactive graph canvas (revision 44).
message UiGraphNode {
  string id = 1;
  string label = 2;
  string group = 3;
  string tone = 4;
  string subtitle = 5;
  double weight = 6;
}

// UiGraphEdge is an edge connecting two UiGraphNodes in a graph canvas
// (revision 44).
message UiGraphEdge {
  string from = 1;
  string to = 2;
  string label = 3;
  string tone = 4;
  bool dashed = 5;
}

// UiOp is a change of a tree. op "replace" puts node in place of the node
// of id; "update" sets the fields of the node of id to node's, its
// children kept; "insert" puts node in as parent's index-th child;
// "remove" takes the node of id out; "move" moves the node of id to be
// its parent's index-th child.
message UiOp {
  string op = 1;
  string id = 2;
  string parent = 3;
  int32 index = 4;
  UiNode node = 5;
}

// ListAgentBlocks asks for the blocks agents of this node's show
// (show_ui), and where each goes; answered by AgentBlocks (revision 27).
// They are the node's alone: no other node has them.
message ListAgentBlocks {
  // node_id is the node whose agents' blocks are asked for, routed as a
  // request's (revision 30).
  string node_id = 1;
}

// AgentBlocks are the agents' blocks, in the order shown.
message AgentBlocks {
  repeated AgentBlock blocks = 1;
}

// AgentBlock is a block an agent shows, agent:<session>/<id>. A front-end
// places it over the layout document it draws, never writing it there:
// by default as the last of the right panel's tabs (the stack "details"),
// shown; with parent set, and the document the window draws the one
// named, as the index-th child of that node (-1 for the last), size px
// along it, as the user allowed.
message AgentBlock {
  string name = 1;
  string session_id = 2;
  string agent = 3;
  string title = 4;
  string document = 5;
  string parent = 6;
  int32 index = 7;
  double size = 8;
}

// ListPanels asks a node for the blocks its window layout documents place,
// and its agents' blocks, each by name with its title and a hint of its
// kind (revision 35): what a node let in, a phone, lists the node's
// panels by before it opens one, as it may not list the node's plugins.
// It says nothing of permissions, settings, registries, or of a plugin no
// document places. Answered by Panels; routed by node_id, as WatchBlock.
message ListPanels {
  string node_id = 1;
}

// Panels are a node's panels, in the order of its documents (the default
// first, then by name, each depth first) and then its agents' blocks,
// each block once.
message Panels {
  repeated Panel panels = 1;
}

// Panel is a block a node's documents place, or one of its agents shows.
message Panel {
  // block is its registered name: mako.<name>, plugin:<id>/<block> or
  // agent:<session>/<id>.
  string block = 1;
  // title is the block's own: a plugin's manifest's, an agent's block's,
  // the window's for its own (in English); "" for a plugin's block this
  // node lacks.
  string title = 2;
  // kind is "builtin", "plugin", "agent", or "missing" for a plugin's
  // block this node lacks: a hint for the icon to list it with.
  string kind = 3;
}

// PluginSyncRow is one row-level CRDT entry in a plugin's synced SQLite table
// (revision 43).
message PluginSyncRow {
  string table = 1;
  string id = 2;
  string doc = 3;
  HLC clock = 4;
  bool deleted = 5;
}

// PluginSyncBucket holds the synced rows for one (plugin_id, scope) database.
message PluginSyncBucket {
  string plugin_id = 1;
  string scope = 2;
  bytes digest = 3;
  repeated PluginSyncRow rows = 4;
}

// PluginSyncBundle carries all synced plugin DB buckets of a node, exchanged
// between mutually trusted peers when plugin_sync_digest differs (revision 43).
message PluginSyncBundle {
  bytes digest = 1;
  repeated PluginSyncBucket buckets = 2;
}

// SyncPluginDB exchanges a peer's PluginSyncBundle and receives the receiver's
// merged PluginSyncBundle in reply.
message SyncPluginDB {
  PluginSyncBundle bundle = 1;
}
