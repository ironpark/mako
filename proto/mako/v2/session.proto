syntax = "proto3";

package mako.v2;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ironpark/mako/internal/protocol";

// ListSessions asks for the mesh's sessions.
message ListSessions {
  // approvals says the asker shows approvals, so an agent asking for one
  // may wait for its answer.
  bool approvals = 1;
}

// Sessions answers ListSessions.
message Sessions {
  repeated SessionInfo sessions = 1;
}

// OpenSession starts an agent session.
message OpenSession {
  string node_id = 1; // empty for the daemon asked
  string agent = 2;
  string profile = 3;
  string project = 4; // the working directory; empty for the node's home
  repeated string args = 5;
  map<string, string> env = 6;
  uint32 cols = 7;
  uint32 rows = 8;
  Worktree worktree = 9; // start in a new worktree of project's repository
  // devices are devices the session's node borrows for it, named as
  // Borrow.device names one: the session starts with the environment that
  // lends each to its programs, holds them until it ends, and borrows
  // them again when it starts again.
  repeated string devices = 10;
}

// Worktree is a git worktree made for one session.
message Worktree {
  string repo = 1; // the main work tree
  string path = 2; // the session's, once made
  string branch = 3; // made for the session
  string base = 4; // the branch it merges into, or opens a pull request into; empty for HEAD's
  string start = 5; // the commit it starts at, when not base, as a pull request's head
}

// SessionInfo describes one session.
message SessionInfo {
  string id = 1;
  string node_id = 2;
  string agent = 3;
  string profile = 4;
  string conversation_id = 5;
  string name = 6;
  string title = 7;
  string project = 8;
  repeated string command = 9;
  string state = 10; // stopped, starting, running, exited
  uint32 cols = 11;
  uint32 rows = 12;
  google.protobuf.Timestamp started_at = 13;
  optional int64 exit_code = 14;
  bool busy = 15;
  bool idle = 16;
  string branch = 17;
  string repo = 18;
  string status = 19; // idle, working, waiting, done
  google.protobuf.Timestamp status_at = 20;
  google.protobuf.Timestamp last_output = 21;
  Approval approval = 22;
  Worktree worktree = 23;
  // owner is the user or organization the repository's origin remote is
  // under, "" outside a repository or without a remote.
  string owner = 24;
  // caps is what mako follows of the session's agent, protocol's Cap
  // bits; 0 from a daemon older than them.
  uint32 caps = 25;
  // remote names the repository the origin remote is of, the same on
  // every node that has a clone of it: "github.com/ironpark/mako". "" as
  // owner is, and for a remote on a local path.
  string remote = 26;
  // last_message is when the conversation's latest prompt or reply was
  // written, as its log says; unset before it has one.
  google.protobuf.Timestamp last_message = 27;
  // agent_scope is the project of several folders the session's agent is
  // in, as its MCP tools know it, "project:" and the project's ID; set in
  // the state a daemon sends its peers, so that agents of one project on
  // other nodes find it. "" outside such a project.
  string agent_scope = 28;
  // agent_messaging says the session's agent takes messages over its MCP
  // tools, as of the same state.
  bool agent_messaging = 29;
  // tasks are the commands the session's agent runs in the background, as
  // Claude Code's Bash does with run_in_background, the latest last: those
  // running, and the last few that ended. None once the session has ended.
  repeated BackgroundTask tasks = 30;
  // git_stamp changes when the project's repository's history does: a
  // commit, a checkout, a branch, a stash, a fetch. It says nothing of what changed: a window showing the
  // repository, on any node, reads it again when it moves. "" outside a
  // repository.
  string git_stamp = 31;
  // turns counts the turns the session's agent has ended, as its hooks
  // or its screen said: one that waits for a turn to end, on any node,
  // waits for it to move. 0 from a daemon older than it.
  uint64 turns = 32;
  // notice is the last desktop notification the session's program posted
  // itself, over OSC 9 or 777; unset before it posts one.
  Notice notice = 33;
  // bells counts the bells the session's program rang: a front-end that
  // sees it move asks for the user's attention.
  uint64 bells = 34;
}

// Notice is a desktop notification a session's program posted. seq grows
// with each, so that one the same as the last still tells.
message Notice {
  string title = 1;
  string body = 2;
  uint64 seq = 3;
}

// BackgroundTask is a command a session's agent started in the background,
// and how it is getting on, as the agent's log says.
message BackgroundTask {
  string id = 1; // the agent's, as it names the task
  string call_id = 2; // the call that started it
  string command = 3; // as written, lines and all, cut short past 1000 characters
  string description = 4;
  bool running = 5;
  // status is how it ended: completed, failed or killed, as the agent
  // said; stopped for one its agent's process did not outlive; "" while
  // it runs.
  string status = 6;
  optional int32 exit_code = 7;
  int64 started = 8; // Unix seconds
  int64 ended = 9; // Unix seconds, once it has
  string output = 10; // the file on the session's node its output goes to
}

// Approval is a tool call an agent waits for the user to approve.
message Approval {
  string id = 1;
  string tool = 2;
  string detail = 3;
  string input = 4; // the call's arguments, as indented JSON
  google.protobuf.Timestamp since = 5;
}

// CloseSession stops a session; the reply is an Exited.
message CloseSession {
  string session_id = 1;
  string node_id = 2;
}

// RenameSession names a session; the reply is its SessionInfo.
message RenameSession {
  string session_id = 1;
  string node_id = 2;
  string name = 3;
}

// AnswerApproval answers the approval a session's agent waits for.
message AnswerApproval {
  string node_id = 1;
  string session_id = 2;
  string approval_id = 3;
  string decision = 4; // allow, deny, terminal
  string message = 5; // why, for a denial
}

// Send types into a session without attaching to it: text pasted as its
// program asked for pastes, bracketed or not, then keys as they are, as
// "\r" submits it or "\x1b" interrupts. The reply is its SessionInfo.
message Send {
  string node_id = 1;
  string session_id = 2;
  string text = 3;
  bytes keys = 4;
}

// Attach turns its stream into a pipe to a session.
message Attach {
  string session_id = 1;
  string node_id = 2;
  bool replay = 3; // send the current screen first
  // pack_stream asks a peer's daemon for the stream's frames packed as one
  // zstd stream: the daemon relaying the attach to its front-end sets it,
  // as it unpacks them. See docs/protocol.md.
  bool pack_stream = 4;
}

// Input is bytes for a session's PTY.
message Input {
  string session_id = 1;
  bytes data = 2;
}

// Output is bytes a session's PTY printed.
message Output {
  string session_id = 1;
  bytes data = 2;
}

// Resize changes a session's window. cell_width and cell_height are a
// cell's size in pixels, as the front-end draws it: the PTY reports the
// window's size in pixels from them, and images a program places are sized
// by them. Zero keeps the size last told. colors, when set, are the
// front-end's: what the session's terminal answers a program asking its
// colours or whether it is dark, and tells one that subscribed to that.
// A Resize of colors alone leaves cols and rows zero.
message Resize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  uint32 cell_width = 4;
  uint32 cell_height = 5;
  TerminalColors colors = 6;
}

// TerminalColors are a front-end's terminal colours, each 0xRRGGBB.
message TerminalColors {
  uint32 foreground = 1;
  uint32 background = 2;
  repeated uint32 palette = 3; // the sixteen ANSI colours
  bool dark = 4;
}

// ProgressReport is a terminal's latest OSC 9;4 state.
message ProgressReport {
  uint32 state = 1;
  int32 value = 2;
  int64 remaining_ms = 3; // relative, so peers need no common clock
}

// Snapshot is a session's screen. On an attach stream its text is left
// out and follows as Output.
message Snapshot {
  ProgressReport progress = 1;
  string session_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  string title = 5;
  string text = 6; // VT when styled, plain otherwise
  bool styled = 7;
}

// Exited reports that a session's program ended.
message Exited {
  string session_id = 1;
  int64 exit_code = 2;
  string err = 3;
}

// ListCommands asks for the slash commands a session's agent takes, for a
// composer to complete: its own, the user's, the project's and its
// plugins', as the session's node finds them.
message ListCommands {
  string node_id = 1;
  string session_id = 2;
}

// Commands answers ListCommands; none for an agent mako knows no commands
// of.
message Commands {
  repeated Command commands = 1;
}

// Command is a slash command, named without its slash.
message Command {
  string name = 1;
  string description = 2;
  string args = 3; // the arguments it takes, as its hint says them
  string source = 4; // "" for the agent's own; "user", "project", or a plugin's name
}
