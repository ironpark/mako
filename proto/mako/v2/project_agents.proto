syntax = "proto3";

package mako.v2;

import "google/protobuf/timestamp.proto";
import "mako/v2/session.proto";

option go_package = "github.com/ironpark/mako/internal/protocol";

// ReadProjectAgents asks for a read-only snapshot of a project's agents
// and recent MCP messages. A worktree includes its repository's sessions.
message ReadProjectAgents {
  string node_id = 1;
  string path = 2;
  uint32 message_limit = 3; // default 50, at most 100
}

// ProjectAgents is a project's agents and recent messages, oldest first.
message ProjectAgents {
  string project = 1;
  repeated ProjectAgent agents = 2;
  repeated AgentMessage messages = 3;
}

// ProjectAgent follows a normal session and its MCP coordination state.
message ProjectAgent {
  SessionInfo session = 1;
  string parent_session_id = 2;
  bool messaging = 3;
  uint32 pending_messages = 4;
}

// AgentMessage is a recent MCP message. Monitoring never acknowledges it.
message AgentMessage {
  uint64 id = 1;
  string from_session_id = 2;
  string to_session_id = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  string state = 6; // pending, acknowledged, removed (recipient deleted)
}

// SetProjects gives a daemon the projects the user put together, as far
// as they have folders on its node: its agents in one project's folders
// see and message each other as one project's, whatever folder each is
// in. A front-end sends every project there is each time, and the daemon
// keeps the last it was given. It answers with the Projects it keeps.
message SetProjects {
  string node_id = 1; // empty for the daemon asked
  repeated ProjectScope projects = 2;
}

// ProjectScope is a project's folders on one node.
message ProjectScope {
  string id = 1;
  string name = 2;
  repeated string paths = 3; // absolute; each holds its subfolders, but not a repository of its own in one
  // give_dirs gives an agent started in one of the folders the others
  // too, as an agent that takes more folders than its own takes them.
  bool give_dirs = 4;
}

// Projects is the projects a daemon keeps, as SetProjects gave them.
message Projects {
  repeated ProjectScope projects = 1;
}

// RelayAgentMessage is a message an agent sent over its MCP tools to an
// agent of its project on another node, which the sender's daemon passes
// to that node's. The receiving daemon takes it when the recipient's agent
// takes messages and is in scope, as the sender, as its peers say, is too.
// It answers with the AgentMessage as the recipient's inbox keeps it.
message RelayAgentMessage {
  string node_id = 1; // the recipient's node
  string from_session_id = 2;
  string to_session_id = 3;
  string text = 4;
  string scope = 5; // the project both are in, "project:" and its ID
}
