syntax = "proto3";

package mako.v2;

import "google/protobuf/timestamp.proto";
import "mako/v2/git.proto";

option go_package = "github.com/ironpark/mako/internal/protocol";

// The forge of the repository a directory is in, GitHub, or a Forgejo or
// Gitea: its pull requests, issues and Actions runs, read and acted on
// with the login the node already has there.

// ForgeList asks for a repository's pull requests, issues or runs.
message ForgeList {
  string node_id = 1;
  string root = 2; // anywhere inside the work tree
  string kind = 3; // pr, issue or run
  string state = 4; // open, closed or all; for runs, ignored
  string branch = 5; // pull requests from, or runs of, this branch only
  int64 max = 6;
  // Of the branch checked out, in place of branch: for pull requests, the
  // one gh finds for it by its upstream.
  bool current = 7;
}

// ForgeItems answers ForgeList.
message ForgeItems {
  repeated ForgeItem items = 1;
  string forge = 2; // which answered: github, forgejo or gitea
  repeated string ops = 3; // the forge_run operations it can do
}

// ForgeItem is a pull request, an issue or a workflow run as a list shows
// it.
message ForgeItem {
  string kind = 1;
  int64 number = 2; // a run's ID
  string title = 3;
  string author = 4;
  // A pull request's OPEN, CLOSED or MERGED; an issue's OPEN or CLOSED; a
  // run's queued, in_progress or completed.
  string state = 5;
  string url = 6;
  google.protobuf.Timestamp updated = 7;
  bool draft = 8;
  string head = 9; // a pull request's branch, or the branch a run is of
  string base = 10;
  string head_oid = 11;
  // A pull request's checks rolled up, success, failure or pending, ""
  // with none; a run's conclusion once completed.
  string checks = 12;
  repeated string labels = 14;
  string workflow = 18; // a run's
  string event = 19; // what started a run: push, pull_request and the like
}

// ForgeView asks for one pull request, issue or run in full. A pull
// request numbered 0 is the one of the branch checked out.
message ForgeView {
  string node_id = 1;
  string root = 2;
  string kind = 3;
  int64 number = 4;
}

// ForgeDetail answers ForgeView.
message ForgeDetail {
  ForgeItem item = 1;
  string body = 2;
  repeated ForgeComment comments = 3; // oldest first
  repeated GitFile files = 4; // a pull request's
  repeated ForgeCheck checks = 5; // a pull request's checks, or a run's jobs
  bool none = 6; // the branch checked out has no pull request
  string forge = 7; // which answered: github, forgejo or gitea
  repeated string ops = 8; // the forge_run operations it can do
}

// ForgeComment is a comment of an issue or pull request, a review, or a
// review's comment on a line.
message ForgeComment {
  string author = 1;
  string body = 2;
  google.protobuf.Timestamp time = 3;
  string review = 4; // a review's APPROVED, CHANGES_REQUESTED or COMMENTED
  string path = 5; // a line comment's file
  int64 line = 6; // and its line, 0 for an outdated one
}

// ForgeCheck is one check of a pull request, or one job of a run.
message ForgeCheck {
  string name = 1;
  string workflow = 2;
  string status = 3; // queued, in_progress or completed
  string conclusion = 4; // once completed: success, failure, cancelled, skipped…
  string url = 5;
}

// ForgeRun acts on a repository on its forge. The reply is a git_result,
// what the forge said.
message ForgeRun {
  string node_id = 1;
  string root = 2;
  string op = 3;
  int64 number = 4; // the pull request, issue or run acted on
  string title = 5;
  string body = 6;
  string base = 7; // a new pull request's base branch
  bool draft = 8;
  string review = 9; // approve, request_changes or comment
  string kind = 10; // pr or issue, which a comment goes on
  bool failed = 11; // a run is run again for its failed jobs only
}
