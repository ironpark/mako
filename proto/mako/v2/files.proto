syntax = "proto3";

package mako.v2;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ironpark/mako/internal/protocol";

// ListDir asks for a directory's entries.
message ListDir {
  string node_id = 1;
  string path = 2; // absolute
}

// DirEntry is one entry of a directory.
message DirEntry {
  string name = 1;
  bool dir = 2;
  bool link = 3;
  int64 size = 4;
  google.protobuf.Timestamp mod_time = 5;
  bool ignored = 6; // left out of the repository by .gitignore
}

// Dir answers ListDir: directories first, then by name.
message Dir {
  string path = 1;
  repeated DirEntry entries = 2;
}

// ReadFile asks for the start of a file, or the whole of an image.
message ReadFile {
  string node_id = 1;
  string path = 2;
  int64 max = 3; // bytes; capped by the daemon
  bool image = 4;
  // A file read in pieces, as a download reads one: raw replies with the
  // bytes from offset on, text or not.
  int64 offset = 5;
  bool raw = 6;
}

// File answers ReadFile, WriteFile and FileOp.
message File {
  string path = 1;
  int64 size = 2;
  bytes data = 3;
  bool truncated = 4; // data is only the start
  bool binary = 5; // not text; data is left out
  google.protobuf.Timestamp mod_time = 6;
}

// WriteFile replaces a file's contents. A set mod_time fails the write,
// with code "changed", if the file changed since. A file sent in pieces,
// as an upload sends one, is written whole by its first piece and grown by
// the rest: each of those gives the offset it goes at, which must be the
// file's length.
message WriteFile {
  string node_id = 1;
  string path = 2;
  bytes data = 3;
  google.protobuf.Timestamp mod_time = 4;
  int64 offset = 5;
}

// Tunnel connects to a TCP port on the node's loopback, where a program
// there serves only that machine, as a web server in development does.
// Once Tunneled answers, the stream carries that connection's bytes, both
// ways, and no more frames.
message Tunnel {
  string node_id = 1;
  int32 port = 2;
}

// Tunneled answers Tunnel: the address connected to.
message Tunneled {
  string addr = 1;
}

// FileOp makes, renames or deletes a file or folder.
message FileOp {
  string node_id = 1;
  string op = 2; // create, mkdir, rename, delete
  string path = 3;
  string to = 4; // where a rename moves path
}

// Search lists a project's files, or the lines holding query.
message Search {
  string node_id = 1;
  string root = 2;
  string query = 3;
  bool files = 4;
}

// SearchMatch is a line holding the query.
message SearchMatch {
  string path = 1;
  int64 line = 2;
  int64 col = 3;
  string text = 4;
}

// SearchResult answers Search.
message SearchResult {
  repeated string files = 1;
  repeated SearchMatch matches = 2;
  bool truncated = 3;
}

// StageFile puts a file a front-end has, one dropped on it, on the node,
// so a session there can be handed its path. A file goes in pieces of at
// most a few megabytes: the first names it and gets back where it is
// kept; the rest give that path and where in the file they go.
message StageFile {
  string node_id = 1;
  string name = 2; // the file's base name, which it keeps
  string path = 3; // empty for the first piece, then what Staged said
  int64 offset = 4; // where data goes in the file
  bytes data = 5;
}

// Staged answers StageFile: where the file is kept, and how long it is.
message Staged {
  string path = 1;
  int64 size = 2;
}
