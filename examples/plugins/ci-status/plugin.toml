# CI status: a block of a GitHub repository's latest Actions runs, and a
# command that runs the latest failed one again. See docs/plugins.md.
id = "ci-status"
version = "0.1.0"
publisher = "ironpark"
api = 1
entry = "main.js"
permissions = ["net:api.github.com", "storage", "sessions:read"]

[[contributes.block]]
id = "ci"
title = "CI"
slots = ["right", "bottom"]

[[contributes.command]]
id = "rerun"
title = "Re-run the latest failed CI run"

[contributes.settings]
repo = { type = "string", label = "Repository", description = "The repository on GitHub, as owner/name." }
token = { type = "secret", label = "GitHub token", description = "A token that may read the repository's Actions, and run them again." }
