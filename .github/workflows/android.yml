name: Android

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: '29.0.14206865'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/mobile/go.mod
          cache-dependency-path: |
            go.sum
            app/mobile/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install mobile bindings
        working-directory: app/mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init
      - name: Test Go packages
        run: CGO_ENABLED=0 go test ./internal/gui ./internal/daemon ./internal/agent/...
      - name: Build mobile node
        run: make -C app core
      - name: Test and lint Android
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-configuration-cache
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        working-directory: app/android
        run: ./gradlew :app:assembleDebug --no-configuration-cache
      - name: Restore release key
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mako-release.p12"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mako-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          ./gradlew :app:assembleRelease --no-configuration-cache \
            -PmakoVersionName="${GITHUB_REF_NAME#android-v}" \
            -PmakoVersionCode="$GITHUB_RUN_NUMBER"
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/release/app-release.apk "dist/mako-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/mako-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "mako Android ${GITHUB_REF_NAME#android-v}" \
            --notes-file app/RELEASE.md
      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/apk/**/*.apk
            app/android/app/build/reports/
            app/android/app/build/outputs/mapping/release/
          if-no-files-found: ignore
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/mako-release.p12"
