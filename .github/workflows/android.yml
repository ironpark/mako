name: Android

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: '29.0.14206865'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/mobile/go.mod
          cache-dependency-path: |
            go.sum
            app/mobile/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install mobile bindings
        working-directory: app/mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile init
      - name: Test Go packages
        run: CGO_ENABLED=0 go test ./internal/gui ./internal/daemon ./internal/agent/...
      - name: Build mobile node
        run: make -C app core
      - name: Test and lint Android
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-configuration-cache
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        working-directory: app/android
        run: ./gradlew :app:assembleDebug --no-configuration-cache
      - name: Restore release key
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mako-release.p12"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mako-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          ./gradlew :app:assembleRelease --no-configuration-cache \
            -PmakoVersionName="${GITHUB_REF_NAME#android-v}" \
            -PmakoVersionCode="$GITHUB_RUN_NUMBER"
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/release/app-release.apk "dist/mako-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/mako-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Compute artifact name
        id: artifact
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            ref="pr-${PR_NUMBER}"
          else
            ref="$(printf '%s' "$REF_NAME" | LC_ALL=C tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')"
            ref="${ref:-ref}"
          fi
          echo "name=android-${ref}-${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name || format('android-run-{0}', github.run_number) }}
          path: |
            app/android/app/build/outputs/apk/**/*.apk
            app/android/app/build/reports/
            app/android/app/build/outputs/mapping/release/
          if-no-files-found: ignore
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/mako-release.p12"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-dist
          path: dist
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/mako-*.apk
      - name: Verify provenance and attach bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          for apk in dist/mako-*.apk; do
            gh attestation verify "$apk" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/android.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          cp "$BUNDLE" "dist/mako-${GITHUB_REF_NAME}.sigstore.json"
      - name: Prepare release notes
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -eu
          cp app/RELEASE.md notes.md
          if [ -n "${ATTESTATION_URL:-}" ]; then
            printf '\nSLSA v1.0 L2 build provenance: [GitHub Attestation](%s)\n' "$ATTESTATION_URL" >> notes.md
          fi
          cat notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          flags=()
          case "${GITHUB_REF_NAME#android-v}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "mako Android ${GITHUB_REF_NAME#android-v}" \
            --notes-file notes.md "${flags[@]}"
